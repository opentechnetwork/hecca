    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151515" stop-opacity="0"/>
      <stop offset="1" stop-color="#151515" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

