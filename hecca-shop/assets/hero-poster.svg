  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F5"/>
      <stop offset="0.55" stop-color="#F6EFE2"/>
      <stop offset="1" stop-color="#EFE5CF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.35" r="0.55">
